<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script defer src="scripts/vue.min.js"></script>
    <script defer src="scripts/main.js"></script>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div id="app">
    <h1>To-Do list</h1>
    <div class="columns">
      <column
        v-for="(column, index) in columns"
        :key="index"
        :column-index="index"
        :column="column"
        :first-column-blocked="firstColumnBlocked && index === 0"
        @card-update="updateColumn"
        @save-data="saveData"
      ></column>
    </div>
  </div>
</body>
</html>
